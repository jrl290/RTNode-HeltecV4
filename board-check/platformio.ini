; The board check image: a separate small firmware that finds which board it
; runs on and reports to the web page in docs/board-check/. It shares nothing
; with RTNode's own code. Build: pio run -d board-check
[platformio]
default_envs = board_check_esp32s3

[env:board_check_esp32s3]
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitc-1
; The image runs on any ESP32-S3 board: DIO flash, 4 MB, no PSRAM (so the
; octal PSRAM pins of 8 MB boards are never set up).
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
	-DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
lib_deps =
	bblanchon/ArduinoJson@7.4.3
	adafruit/Adafruit GFX Library@1.13.0
	adafruit/Adafruit BusIO@1.17.4
	adafruit/Adafruit SSD1306@2.5.17
	adafruit/Adafruit SH110X@2.1.14
	adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
	h2zero/NimBLE-Arduino@1.4.3
